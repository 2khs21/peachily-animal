<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>로켓 발사 미니게임</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family:
					system-ui,
					-apple-system,
					'Noto Sans KR',
					sans-serif;
				background: #07111f;
				color: white;
			}
			.game {
				position: relative;
				min-height: 100vh;
				overflow: hidden;
				background:
					#07111f url('public/assets/background/space.webp') center /
					cover no-repeat;
			}
			.star {
				position: absolute;
				color: #fff;
				opacity: 0.7;
			}
			#status {
				position: absolute;
				top: 30px;
				width: 100%;
				text-align: center;
				font-size: 24px;
				font-weight: 800;
			}
			#count {
				position: absolute;
				top: 75px;
				width: 100%;
				text-align: center;
				font-size: 64px;
				font-weight: 900;
			}
			#rocketWrap {
				position: absolute;
				left: 50%;
				bottom: 138px;
				transform: translateX(-50%);
				z-index: 3;
			}
			.rocket {
				position: relative;
				width: 240px;
				height: 240px;
				transform-origin: 50% 72%;
			}
			.rocket-img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: contain;
				clip-path: inset(0 0 24% 0);
			}
			.ignited .rocket-img {
				clip-path: none;
			}
			.ignited {
				animation: shake 0.07s infinite alternate;
			}
			.pad {
				position: absolute;
				left: 50%;
				bottom: 120px;
				transform: translateX(-50%);
				width: 246px;
				height: 72px;
				z-index: 2;
			}
			.pad-top {
				position: absolute;
				top: 0;
				left: 40px;
				right: 40px;
				height: 10px;
				border-radius: 3px;
				background: #7d8d9c;
			}
			.pad-leg {
				position: absolute;
				top: 6px;
				width: 10px;
				height: 66px;
				border-radius: 3px;
				background: #7d8d9c;
				transform-origin: 50% 0;
			}
			.pad-leg.left {
				left: 44px;
				transform: rotate(20deg);
			}
			.pad-leg.right {
				right: 44px;
				transform: rotate(-20deg);
			}
			.ground {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 36vh;
				min-height: 220px;
				z-index: 1;
				pointer-events: none;
				background: url('public/assets/background/moon-surface.webp')
					center bottom / cover no-repeat;
			}
			.controls {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 28px;
				z-index: 8;
				display: flex;
				justify-content: center;
				gap: 12px;
			}
			button {
				border: 0;
				border-radius: 14px;
				padding: 15px 22px;
				font-size: 17px;
				font-weight: 800;
				cursor: pointer;
			}
			#launch {
				background: #ff5c35;
				color: white;
			}
			#reset {
				background: #e7edf5;
				color: #17202a;
			}
			#smoke {
				position: absolute;
				inset: 0;
				z-index: 4;
				pointer-events: none;
			}
			.smoke {
				position: absolute;
				border-radius: 50%;
				background: #d7dbe0;
				opacity: 0.7;
				filter: blur(1px);
				animation: puff 1.6s ease-out forwards;
			}
			.fly {
				animation: fly 3s ease-in forwards;
			}
			@keyframes flame {
				to {
					transform: scaleY(1.25) scaleX(0.85);
				}
			}
			@keyframes shake {
				from {
					transform: translateX(-2px) rotate(-1deg);
				}
				to {
					transform: translateX(2px) rotate(1deg);
				}
			}
			@keyframes fly {
				0% {
					bottom: 138px;
				}
				15% {
					bottom: 153px;
				}
				100% {
					bottom: 110vh;
				}
			}
			@keyframes puff {
				to {
					transform: translate(var(--x), var(--y)) scaleX(var(--sx))
						scaleY(var(--sy));
					opacity: 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="game" id="game">
			<span class="star" style="left: 10%; top: 12%">✦</span
			><span class="star" style="left: 25%; top: 28%">·</span>
			<span class="star" style="right: 15%; top: 15%">✧</span
			><span class="star" style="right: 28%; top: 34%">✦</span>
			<div id="status">발사 준비 완료</div>
			<div id="count"></div>
			<div id="rocketWrap" class="">
				<div class="rocket" id="rocket">
					<img
						class="rocket-img"
						src="public/assets/rocket/roket.png"
						alt="로켓"
					/>
				</div>
			</div>
			<div id="smoke"></div>
			<div class="pad">
				<div class="pad-top"></div>
				<div class="pad-leg left"></div>
				<div class="pad-leg right"></div>
			</div>
			<div class="ground"></div>
			<div class="controls">
				<button id="launch">🚀 로켓 발사</button
				><button id="reset">다시 준비</button>
			</div>
		</div>
		<script>
			const launch = document.querySelector('#launch'),
				reset = document.querySelector('#reset'),
				rocket = document.querySelector('#rocket'),
				wrap = document.querySelector('#rocketWrap'),
				smoke = document.querySelector('#smoke'),
				game = document.querySelector('#game'),
				statusEl = document.querySelector('#status'),
				count = document.querySelector('#count');
			let busy = false,
				puffTimer = null,
				timers = [];
			function later(fn, ms) {
				let t = setTimeout(fn, ms);
				timers.push(t);
			}
			function puff() {
				const p = document.createElement('i'),
					s = 26 + Math.random() * 50,
					flying = wrap.classList.contains('fly'),
					side = Math.random() < 0.5 ? -1 : 1;
				let nozzle = 176;
				if (flying) {
					const gameRect = game.getBoundingClientRect(),
						wrapRect = wrap.getBoundingClientRect();
					nozzle = Math.max(120, gameRect.bottom - wrapRect.bottom + 24);
				}
				const spread = flying
					? 12 + Math.random() * 36
					: 55 + Math.random() * 95;
				p.className = 'smoke';
				p.style.width = p.style.height = s + 'px';
				p.style.left = `calc(50% + ${side * spread}px - ${s / 2}px)`;
				p.style.bottom = nozzle + Math.random() * 16 + 'px';
				if (flying) {
					p.style.setProperty('--x', side * (12 + Math.random() * 48) + 'px');
					p.style.setProperty('--y', 18 + Math.random() * 46 + 'px');
					p.style.setProperty('--sx', 1.5 + Math.random());
					p.style.setProperty('--sy', 1.7 + Math.random());
				} else {
					p.style.setProperty('--x', side * (100 + Math.random() * 220) + 'px');
					p.style.setProperty('--y', 6 + Math.random() * 58 + 'px');
					p.style.setProperty('--sx', 2.5 + Math.random() * 1.8);
					p.style.setProperty('--sy', 1.15 + Math.random() * 0.7);
				}
				smoke.appendChild(p);
				later(() => p.remove(), 1800);
			}
			function start() {
				if (busy) return;
				busy = true;
				launch.disabled = true;
				statusEl.textContent = '카운트다운';
				let n = 3;
				count.textContent = n;
				let timer = setInterval(() => {
					n--;
					if (n) {
						count.textContent = n;
					} else {
						clearInterval(timer);
						count.textContent = '';
						statusEl.textContent = '엔진 점화! 🔥';
						rocket.classList.add('ignited');
						for (let i = 0; i < 24; i++) later(puff, i * 40);
						puffTimer = setInterval(puff, 45);
						later(() => {
							statusEl.textContent = '발사! 🚀';
							wrap.classList.add('fly');
						}, 800);
						later(() => {
							clearInterval(puffTimer);
							puffTimer = null;
							statusEl.textContent = '우주를 향해 상승 중! ✨';
						}, 3600);
					}
				}, 700);
			}
			function restart() {
				timers.forEach(clearTimeout);
				timers = [];
				if (puffTimer) clearInterval(puffTimer);
				puffTimer = null;
				busy = false;
				launch.disabled = false;
				rocket.classList.remove('ignited');
				wrap.classList.remove('fly');
				smoke.innerHTML = '';
				count.textContent = '';
				statusEl.textContent = '발사 준비 완료';
				void wrap.offsetWidth;
			}
			launch.addEventListener('click', start);
			reset.addEventListener('click', restart);
		</script>
	</body>
</html>
