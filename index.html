<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>로켓 발사 미니게임</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="game" id="game">
			<span class="star" style="left: 10%; top: 12%">✦</span>
			<span class="star" style="left: 25%; top: 28%">·</span>
			<span class="star" style="right: 15%; top: 15%">✧</span>
			<span class="star" style="right: 28%; top: 34%">✦</span>
			<div id="status">발사 준비 완료</div>
			<div id="count"></div>
			<div id="rocketWrap">
				<div class="rocket" id="rocket">
					<img
						class="rocket-img"
						src="public/assets/rocket/roket.png"
						alt="로켓"
					/>
				</div>
			</div>
			<div id="smoke"></div>
			<div class="pad">
				<div class="pad-top"></div>
				<div class="pad-leg left"></div>
				<div class="pad-leg right"></div>
			</div>
			<div class="ground"></div>
			<div class="controls">
				<button id="launch">🚀 로켓 발사</button>
				<button id="reset">다시 준비</button>
			</div>
		</div>
		<script type="module" src="js/main.js"></script>
	</body>
</html>
