<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>동물 구출 미니게임</title>
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="css/tens-complement.css" />
		<link rel="stylesheet" href="css/success.css" />
	</head>
	<body>
		<div class="game" id="game">
			<span class="star" style="left: 10%; top: 12%">✦</span>
			<span class="star" style="left: 25%; top: 28%">·</span>
			<span class="star" style="right: 15%; top: 15%">✧</span>
			<span class="star" style="right: 28%; top: 34%">✦</span>
			<img
				class="earth"
				id="earth"
				src="public/assets/earth/earth.webp"
				alt="지구"
			/>
			<p id="announce" hidden></p>
			<div class="widget" id="widget" hidden>
				<p class="copy" id="copy">숫자 키패드로 연료를 넣어 주세요</p>
				<div class="gauge" id="gauge" aria-hidden="true">
					<div class="row" id="rowMain"></div>
					<div class="row row-over" id="rowOver" hidden></div>
				</div>
				<div class="panel">
					<div class="equation" id="equation">
						<span class="term" id="termA">8</span>
						<span class="op">+</span>
						<span class="box" id="termB"></span>
						<span class="op">=</span>
						<span class="box" id="termSum">8</span>
					</div>
				</div>
			</div>
			<div id="rocketWrap">
				<div class="rocket" id="rocket">
					<img
						class="rocket-img"
						src="public/assets/rocket/roket.png"
						alt="로켓"
					/>
					<div class="window-passengers" id="windowPassengers"></div>
				</div>
			</div>
			<div id="smoke"></div>
			<div class="pad">
				<div class="pad-top"></div>
				<div class="pad-leg left"></div>
				<div class="pad-leg right"></div>
			</div>
			<div class="ground"></div>
			<div id="animals"></div>
			<div class="controls">
				<button type="button" id="launch" hidden>발사</button>
			</div>
			<div class="success" id="success" hidden>
				<div class="success-scene" aria-hidden="true"></div>
				<div class="success-flash" aria-hidden="true"></div>
				<div class="copy">
					<h1>동물 친구들 구출 성공!</h1>
					<p>의찬아, 지후야 고마워!</p>
				</div>
			</div>
		</div>
		<script type="module" src="js/main.js"></script>
	</body>
</html>
